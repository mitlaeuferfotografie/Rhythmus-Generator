<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rhythmus-Generator</title>
<!-- ?v=N auf style.css/script.js bei jedem inhaltlichen Deploy erhöhen:
     GitHub Pages cacht beide Dateien 10 Minuten (Cache-Control: max-age=600).
     Ohne Versionsnummer kann ein Browser sonst eine alte index.html mit
     einem neuen script.js mischen (oder umgekehrt) und abstürzen, wenn
     sich IDs/Struktur zwischen den Versionen geändert haben. -->
<link rel="stylesheet" href="style.css?v=8">
</head>
<body>

<header class="toolbar">
  <h1>Rhythmus-Generator</h1>

  <div class="toolbar-group">
    <button id="addMeasureBtn" class="btn">+ Takt</button>
    <button id="clearBtn" class="btn btn-secondary">Alles leeren</button>
  </div>

  <button id="settingsToggle" class="btn btn-secondary" aria-expanded="false" aria-controls="settingsPanel">
    ⚙ Einstellungen
  </button>

  <div id="settingsPanel" class="settings-panel" hidden>
    <label class="tempo-label">
      Tempo: <span id="bpmValue">90</span> BPM
      <input type="range" id="bpmSlider" min="40" max="180" value="90">
    </label>
    <label class="metronome-label">
      <input type="checkbox" id="metronomeToggle" checked>
      Grundschlag
    </label>
    <label class="repeat-label">
      Wiederholungen:
      <input type="number" id="repeatInput" min="1" max="50" value="4">
    </label>
  </div>
</header>

<section class="palette" aria-label="Notenwerte-Palette">
  <div class="palette-columns">
    <div class="palette-group">
      <h3>Noten</h3>
      <div class="palette-cards" id="paletteCardsNotes">
        <!-- populated by script.js -->
      </div>
    </div>
    <div class="palette-group">
      <h3>Pausen</h3>
      <div class="palette-cards" id="paletteCardsRests">
        <!-- populated by script.js -->
      </div>
    </div>
  </div>
  <p class="palette-hint">Karte in einen Takt ziehen</p>
</section>

<main>
  <section class="score" aria-label="Rhythmus-Partitur">
    <div id="measures" class="measures">
      <!-- measures populated by script.js -->
    </div>
  </section>
</main>

<button id="playPauseBtn" class="play-pause-btn">▶ Abspielen</button>

<div id="dragGhost" class="drag-ghost" hidden></div>

<script src="script.js?v=8"></script>
</body>
</html>
